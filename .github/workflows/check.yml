name: check

on:
  push:
  pull_request:

jobs:
  check:
    # The engine's network services are Windows-first, so match the dev host.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout engine
        uses: actions/checkout@v4
        with:
          path: engine

      # Optional sibling repo. It is a *separate private* repo, so the default
      # GITHUB_TOKEN cannot read it: provide a VULNDB_TOKEN secret (fine-grained
      # PAT with Contents: read) to enable the catalog tests. Without it the
      # checkout fails, the tests skip (error.SkipZigTest) and build.zig omits the
      # vulns smoke step - the engine repo stays independently checkable.
      - name: Checkout vulnerability db (optional)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/PocketRootVulnerabilityDb
          path: PocketRootVulnerabilityDb
          token: ${{ secrets.VULNDB_TOKEN || github.token }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Format check
        run: zig fmt --check build.zig build.zig.zon src

      - name: Tests
        run: zig build test --summary all

      - name: Smoke
        run: zig build smoke --summary all
